<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Borsa Terminal</title>
  <meta name="theme-color" content="#0b0f17">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Borsa">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css" media="(max-width: 760px)">
</head>
<body>
  <header id="topbar">
    <a class="logo" href="#/"><img class="logo-img" src="icons/icon-192.png" alt="" width="26" height="26"><span class="logo-text">Borsa Terminal</span></a>
    <div class="search">
      <input id="search" type="search" placeholder="Hisse ara… (THYAO, GARAN, US:AAPL, ^GSPC)" autocomplete="off" aria-label="Sembol ara">
      <div id="suggest" class="suggest" hidden></div>
    </div>
    <div id="mkt-status" class="mkt-status"></div>
    <span id="demo-badge" class="badge warn" hidden title="Gerçek veri değil">DEMO VERİSİ</span>
    <button id="install" class="btn sm" hidden title="Uygulamayı bu cihaza yükle">⬇ Yükle</button>
    <button id="logout" class="btn ghost sm" hidden title="Çıkış yap">Çıkış</button>
    <button id="theme" class="btn ghost sm" title="Tema (açık/koyu)" aria-label="Tema değiştir">🌓</button>
  </header>
  <div id="tape" class="tape" aria-label="Piyasa şeridi"></div>
  <div id="layout">
    <nav id="side" aria-label="Ana menü">
      <a href="#/" data-nav="/">📊 <span>Panel</span></a>
      <a href="#/markets" data-nav="/markets">🏛 <span>Piyasalar</span></a>
      <a href="#/heatmap" data-nav="/heatmap">🗺 <span>Harita</span></a>
      <a href="#/signals" data-nav="/signals">🚦 <span>Sinyaller</span></a>
      <a href="#/watchlist" data-nav="/watchlist">⭐ <span>Takip Listesi</span></a>
      <a href="#/portfolio" data-nav="/portfolio">💼 <span>Portföy</span></a>
      <a href="#/screener" data-nav="/screener">🔎 <span>Tarayıcı</span></a>
      <a href="#/compare" data-nav="/compare">📈 <span>Karşılaştır</span></a>
      <a href="#/alerts" data-nav="/alerts">🔔 <span>Alarmlar</span><b id="alert-count" hidden></b></a>
      <div class="side-note">Fiyatlar ~15 dk gecikmelidir. Yatırım tavsiyesi değildir.</div>
    </nav>
    <main id="view"></main>
  </div>
  <div id="toasts"></div>
  <div id="login" class="login-overlay" hidden>
    <form id="login-form" class="card login-box" autocomplete="on">
      <h1><img src="icons/icon-192.png" alt="" width="28" height="28" style="border-radius:7px;vertical-align:middle"> Borsa Terminal</h1>
      <div class="muted small">Devam etmek için şifrenizi girin.</div>
      <input id="login-user" type="text" autocomplete="username" value="borsa" hidden>
      <input id="login-pw" type="password" autocomplete="current-password" placeholder="Şifre" required aria-label="Şifre">
      <label class="small"><input id="login-remember" type="checkbox"> Bu cihazda hatırla</label>
      <button class="btn primary" id="login-go">Giriş yap</button>
      <div id="login-msg" class="down small" role="alert"></div>
    </form>
  </div>
  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
